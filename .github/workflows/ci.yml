name: CI Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis, Types & Linting
  # -------------------------------------------------------------
  quality-and-typecheck:
    name: Typecheck & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Across Workspaces
        run: npm run typecheck

      - name: Lint Verification
        run: npm run lint

  # -------------------------------------------------------------
  # Job 2: Unit & Component Tests across Workspaces
  # -------------------------------------------------------------
  unit-and-component-tests:
    name: Unit & Component Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Suites
        run: npm test

  # -------------------------------------------------------------
  # Job 3: Monorepo Production Build
  # -------------------------------------------------------------
  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile All Workspaces
        run: npm run build

  # -------------------------------------------------------------
  # Job 4: Playwright E2E & Visual Regression Quality Checks
  # -------------------------------------------------------------
  e2e-and-visual-regression:
    name: Playwright E2E & Visual Regression
    runs-on: ubuntu-latest
    needs: [quality-and-typecheck, unit-and-component-tests, build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Deterministic Custom PDF Fixture Generation
        run: npm run fixtures:generate

      - name: Compile Workspace Packages
        run: npm run build

      - name: Run Playwright E2E & Visual Regression Tests
        run: npx playwright test

      - name: Upload Playwright Test Report & Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # -------------------------------------------------------------
  # Job 5: Gated Production Deployment to Vercel
  # Deploys to Vercel Production ONLY after all 4 quality gates pass
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: [quality-and-typecheck, unit-and-component-tests, build, e2e-and-visual-regression]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify Vercel Deployment Secrets
        id: check-credentials
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::notice title=Vercel Token Not Configured::VERCEL_TOKEN secret is not configured in repository secrets. Automated deployment via GitHub Actions will be skipped. See DEPLOYMENT.md for setup instructions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm ci

      - name: Compile Vercel Production Bundle
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm run build:vercel

      - name: Deploy Verified Build to Vercel Production
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  # -------------------------------------------------------------
  # Job 6: Gated Pull Request Preview Deployment to Vercel
  # Generates an ephemeral preview URL ONLY after all 4 quality gates pass
  # -------------------------------------------------------------
  deploy-preview:
    name: Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    needs: [quality-and-typecheck, unit-and-component-tests, build, e2e-and-visual-regression]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify Vercel Deployment Secrets
        id: check-credentials
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::notice title=Vercel Token Not Configured::VERCEL_TOKEN secret is not configured in repository secrets. Skipping preview deployment."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm ci

      - name: Compile Vercel Production Bundle
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm run build:vercel

      - name: Deploy Verified Preview to Vercel
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true
          working-directory: ./

